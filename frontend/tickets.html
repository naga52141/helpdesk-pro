<!DOCTYPE html>
<html lang="en">
<head>
  <script src="js/theme.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HelpDesk Pro — Tickets</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body class="app-body">
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <header class="navbar">
    <div class="navbar-left">
      <span class="brand-mark">HD</span>
      <span class="navbar-title">HelpDesk Pro</span>
    </div>

    <nav class="navbar-links">
      <a href="dashboard.html" class="nav-link">Dashboard</a>
      <a href="tickets.html" class="nav-link active">Tickets</a>
      <a href="knowledge-base.html" class="nav-link">Knowledge Base</a>
      <a href="analytics.html" class="nav-link staff-only" hidden>Analytics</a>
      <a href="admin.html" class="nav-link admin-only" hidden>Admin</a>
    </nav>

    <div class="navbar-right">
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle theme"></button>
      <div class="notification-bell-wrap">
        <button type="button" id="notification-bell" class="notification-bell" aria-label="Notifications" aria-haspopup="true" aria-expanded="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
          <span id="notification-badge" class="notification-badge" hidden>0</span>
        </button>
        <div id="notification-dropdown" class="notification-dropdown" hidden>
          <div class="notification-dropdown-header">
            <span>Notifications</span>
            <button type="button" id="mark-all-read-btn" class="mark-all-read-btn">Mark all read</button>
          </div>
          <div id="notification-list" class="notification-list"></div>
        </div>
      </div>

      <div class="user-chip">
        <span id="current-user-name" class="user-chip-name"></span>
        <span id="current-user-role" class="role-chip"></span>
        <button type="button" id="logout-btn" class="btn-secondary">Logout</button>
      </div>
      <a href="new-ticket.html" class="btn-primary btn-new-ticket">+ New Ticket</a>
    </div>
  </header>

  <main class="dashboard-main" id="main-content" tabindex="-1">
    <div class="dashboard-heading">
      <h2 id="tickets-title">My tickets</h2>
      <p class="text-muted" id="tickets-count"></p>
      <p id="tickets-error" class="form-error" hidden></p>
    </div>

    <section class="filter-bar">
      <input type="text" id="search-input" class="filter-search" placeholder="Search by ticket ID or title..." />

      <select id="filter-status">
        <option value="all">All statuses</option>
        <option value="open">Open</option>
        <option value="in-progress">In Progress</option>
        <option value="resolved">Resolved</option>
        <option value="closed">Closed</option>
      </select>

      <select id="filter-priority">
        <option value="all">All priorities</option>
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
        <option value="critical">Critical</option>
      </select>

      <select id="filter-category">
        <option value="all">All categories</option>
        <option value="Hardware">Hardware</option>
        <option value="Software">Software</option>
        <option value="Network">Network</option>
        <option value="Account Access">Account Access</option>
        <option value="Other">Other</option>
      </select>

      <select id="filter-agent">
        <option value="all">All agents</option>
        <option value="Alex Kim">Alex Kim</option>
        <option value="Priya Nair">Priya Nair</option>
        <option value="Jordan Lee">Jordan Lee</option>
        <option value="Unassigned">Unassigned</option>
      </select>

      <button type="button" id="clear-filters" class="btn-secondary">Clear</button>
      <button type="button" id="export-csv-btn" class="btn-secondary">Export CSV</button>
    </section>

    <div id="bulk-actions-bar" class="bulk-actions-bar staff-only" hidden>
      <span id="bulk-selected-count"></span>

      <select id="bulk-status">
        <option value="">Change status...</option>
        <option value="open">Open</option>
        <option value="in-progress">In Progress</option>
        <option value="resolved">Resolved</option>
        <option value="closed">Closed</option>
      </select>

      <select id="bulk-priority">
        <option value="">Change priority...</option>
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
        <option value="critical">Critical</option>
      </select>

      <select id="bulk-assign">
        <option value="">Assign to...</option>
        <option value="unassign">Unassigned</option>
      </select>

      <button type="button" id="bulk-apply-btn" class="btn-primary btn-submit">Apply</button>
      <button type="button" id="bulk-clear-btn" class="btn-secondary">Clear selection</button>
      <p id="bulk-error" class="form-error" hidden></p>
    </div>

    <section class="recent-section">
      <div class="table-wrap">
        <table class="ticket-table">
          <thead>
            <tr>
              <th class="staff-only" hidden><input type="checkbox" id="select-all-checkbox" aria-label="Select all tickets" /></th>
              <th>ID</th>
              <th>Title</th>
              <th>Category</th>
              <th>Priority</th>
              <th>Status</th>
              <th>Assigned Agent</th>
              <th>Department</th>
              <th>Updated</th>
            </tr>
          </thead>
          <tbody id="tickets-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="http://localhost:4000/socket.io/socket.io.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/realtime.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/tickets.js"></script>
</body>
</html>

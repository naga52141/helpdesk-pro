<!DOCTYPE html>
<html lang="en">
<head>
  <script src="js/theme.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HelpDesk Pro — Article Editor</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body class="app-body">
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <header class="navbar">
    <div class="navbar-left">
      <span class="brand-mark">HD</span>
      <span class="navbar-title">HelpDesk Pro</span>
    </div>

    <nav class="navbar-links">
      <a href="dashboard.html" class="nav-link">Dashboard</a>
      <a href="tickets.html" class="nav-link">Tickets</a>
      <a href="knowledge-base.html" class="nav-link active">Knowledge Base</a>
      <a href="analytics.html" class="nav-link staff-only" hidden>Analytics</a>
      <a href="admin.html" class="nav-link admin-only" hidden>Admin</a>
    </nav>

    <div class="navbar-right">
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle theme"></button>
      <div class="notification-bell-wrap">
        <button type="button" id="notification-bell" class="notification-bell" aria-label="Notifications" aria-haspopup="true" aria-expanded="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
          <span id="notification-badge" class="notification-badge" hidden>0</span>
        </button>
        <div id="notification-dropdown" class="notification-dropdown" hidden>
          <div class="notification-dropdown-header">
            <span>Notifications</span>
            <button type="button" id="mark-all-read-btn" class="mark-all-read-btn">Mark all read</button>
          </div>
          <div id="notification-list" class="notification-list"></div>
        </div>
      </div>

      <div class="user-chip">
        <span id="current-user-name" class="user-chip-name"></span>
        <span id="current-user-role" class="role-chip"></span>
        <a href="account.html" class="btn-secondary">Account</a>
        <button type="button" id="logout-btn" class="btn-secondary">Logout</button>
      </div>
      <a href="new-ticket.html" class="btn-primary btn-new-ticket">+ New Ticket</a>
    </div>
  </header>

  <main class="dashboard-main" id="main-content" tabindex="-1">
    <div class="dashboard-heading">
      <h2 id="form-heading">New Article</h2>
      <p class="text-muted">Write a self-service help article</p>
    </div>

    <div id="access-denied" class="access-denied" hidden>
      <p>Creating knowledge base articles is available to agents and admins only.</p>
    </div>

    <section class="form-card" id="article-form-card" hidden>
      <form id="article-form" novalidate>
        <label for="title">Title</label>
        <input type="text" id="title" name="title" placeholder="e.g. Resetting your password" required />

        <label for="category">Category</label>
        <select id="category" name="category" required>
          <option value="" disabled selected>Select category</option>
        </select>

        <label for="content">Content</label>
        <textarea id="content" name="content" rows="12" placeholder="Write the article content..." required></textarea>

        <p class="form-error" id="form-error" hidden></p>

        <div class="form-actions">
          <a href="knowledge-base.html" class="btn-secondary">Cancel</a>
          <button type="submit" class="btn-primary btn-submit" id="submit-btn">Publish Article</button>
        </div>
      </form>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/realtime.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/article-form.js"></script>
</body>
</html>

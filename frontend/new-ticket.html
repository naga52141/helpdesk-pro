<!DOCTYPE html>
<html lang="en">
<head>
  <script src="js/theme.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HelpDesk Pro — New Ticket</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body class="app-body">
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <header class="navbar">
    <div class="navbar-left">
      <span class="brand-mark">HD</span>
      <span class="navbar-title">HelpDesk Pro</span>
    </div>

    <nav class="navbar-links">
      <a href="dashboard.html" class="nav-link">Dashboard</a>
      <a href="tickets.html" class="nav-link active">Tickets</a>
      <a href="knowledge-base.html" class="nav-link">Knowledge Base</a>
      <a href="analytics.html" class="nav-link staff-only" hidden>Analytics</a>
      <a href="admin.html" class="nav-link admin-only" hidden>Admin</a>
    </nav>

    <div class="navbar-right">
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle theme"></button>
      <div class="notification-bell-wrap">
        <button type="button" id="notification-bell" class="notification-bell" aria-label="Notifications" aria-haspopup="true" aria-expanded="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
          <span id="notification-badge" class="notification-badge" hidden>0</span>
        </button>
        <div id="notification-dropdown" class="notification-dropdown" hidden>
          <div class="notification-dropdown-header">
            <span>Notifications</span>
            <button type="button" id="mark-all-read-btn" class="mark-all-read-btn">Mark all read</button>
          </div>
          <div id="notification-list" class="notification-list"></div>
        </div>
      </div>

      <div class="user-chip">
        <span id="current-user-name" class="user-chip-name"></span>
        <span id="current-user-role" class="role-chip"></span>
        <a href="account.html" class="btn-secondary">Account</a>
        <button type="button" id="logout-btn" class="btn-secondary">Logout</button>
      </div>
    </div>
  </header>

  <main class="dashboard-main" id="main-content" tabindex="-1">
    <div class="dashboard-heading">
      <h2>New Ticket</h2>
      <p class="text-muted">Describe the issue and we'll route it to the right team</p>
    </div>

    <section class="form-card">
      <form id="ticket-form" novalidate>
        <label for="title">Issue title</label>
        <input type="text" id="title" name="title" placeholder="e.g. Can't connect to VPN" required />

        <div id="kb-suggestions" class="kb-suggestions" hidden>
          <div class="kb-suggestions-title">Related help articles</div>
          <div id="kb-suggestions-list"></div>
        </div>

        <label for="description">Description</label>
        <textarea id="description" name="description" rows="5" placeholder="What happened? Steps to reproduce, error messages, etc." required></textarea>

        <div class="form-row">
          <div class="form-col">
            <label for="category">Category</label>
            <select id="category" name="category" required>
              <option value="" disabled selected>Select category</option>
            </select>
          </div>

          <div class="form-col">
            <label for="priority">Priority</label>
            <select id="priority" name="priority" required>
              <option value="" disabled selected>Select priority</option>
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
              <option value="critical">Critical</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-col">
            <label for="department">Department</label>
            <select id="department" name="department" required>
              <option value="" disabled selected>Select department</option>
            </select>
          </div>

          <div class="form-col">
            <label for="device-info">Device information</label>
            <input type="text" id="device-info" name="deviceInfo" placeholder="e.g. Dell Latitude 5420, Windows 11" />
          </div>
        </div>

        <label for="attachment">Attachment</label>
        <input type="file" id="attachment" name="attachment" />

        <p class="form-error" id="form-error" hidden></p>

        <div class="form-actions">
          <a href="dashboard.html" class="btn-secondary">Cancel</a>
          <button type="submit" class="btn-primary btn-submit">Submit Ticket</button>
        </div>
      </form>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/realtime.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/assistant.js"></script>
  <script src="js/new-ticket.js"></script>
</body>
</html>

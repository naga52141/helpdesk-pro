<!DOCTYPE html>
<html lang="en">
<head>
  <script src="js/theme.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HelpDesk Pro — Forgot Password</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">
    <button type="button" id="theme-toggle" class="theme-toggle theme-toggle-floating" aria-label="Toggle theme"></button>
    <div class="login-card">
      <div class="brand">
        <span class="brand-mark">HD</span>
        <h1>HelpDesk Pro</h1>
      </div>
      <p class="subtitle">Enter your email and we'll help you reset your password</p>

      <form id="forgot-form" novalidate>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required />

        <p class="form-error" id="form-error" hidden></p>

        <button type="submit" class="btn-primary">Send reset link</button>
      </form>

      <div id="result-box" class="demo-notice" hidden>
        <p id="result-message"></p>
        <p id="demo-caveat" class="demo-caveat" hidden>
          This demo has no real email sending configured, so here's the reset link directly:
        </p>
        <a id="reset-link" class="btn-primary" href="#" hidden>Continue to reset password</a>
      </div>

      <p class="signup-hint"><a href="index.html">Back to login</a></p>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/forgot-password.js"></script>
</body>
</html>

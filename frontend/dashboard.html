<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HelpDesk Pro — Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body class="app-body">
  <header class="navbar">
    <div class="navbar-left">
      <span class="brand-mark">HD</span>
      <span class="navbar-title">HelpDesk Pro</span>
    </div>

    <nav class="navbar-links">
      <a href="dashboard.html" class="nav-link active">Dashboard</a>
      <a href="tickets.html" class="nav-link">Tickets</a>
      <a href="analytics.html" class="nav-link staff-only" hidden>Analytics</a>
      <a href="admin.html" class="nav-link admin-only" hidden>Admin</a>
    </nav>

    <div class="navbar-right">
      <div class="user-chip">
        <span id="current-user-name" class="user-chip-name"></span>
        <span id="current-user-role" class="role-chip"></span>
        <button type="button" id="logout-btn" class="btn-secondary">Logout</button>
      </div>
      <a href="new-ticket.html" class="btn-primary btn-new-ticket">+ New Ticket</a>
    </div>
  </header>

  <main class="dashboard-main">
    <div class="dashboard-heading">
      <h2 id="dashboard-greeting">Welcome back</h2>
      <p id="dashboard-subtitle" class="text-muted">Here's what's happening with your tickets</p>
      <p id="dashboard-error" class="form-error" hidden></p>
    </div>

    <section class="stat-grid" id="stat-grid" aria-label="Ticket statistics"></section>

    <section class="recent-section">
      <div class="recent-header">
        <h3 id="recent-title">Recent tickets</h3>
      </div>
      <div class="table-wrap">
        <table class="ticket-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Title</th>
              <th>Category</th>
              <th>Priority</th>
              <th>Status</th>
              <th>Updated</th>
            </tr>
          </thead>
          <tbody id="recent-tickets-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <script src="js/theme.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HelpDesk Pro — Reset Password</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">
    <button type="button" id="theme-toggle" class="theme-toggle theme-toggle-floating" aria-label="Toggle theme"></button>
    <div class="login-card">
      <div class="brand">
        <span class="brand-mark">HD</span>
        <h1>HelpDesk Pro</h1>
      </div>
      <p class="subtitle">Choose a new password</p>

      <form id="reset-form" novalidate>
        <label for="password">New password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required />

        <label for="confirm-password">Confirm new password</label>
        <input type="password" id="confirm-password" name="confirmPassword" placeholder="••••••••" required />

        <p class="form-error" id="form-error" hidden></p>

        <button type="submit" class="btn-primary">Reset password</button>
      </form>

      <p class="signup-hint"><a href="index.html">Back to login</a></p>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/reset-password.js"></script>
</body>
</html>

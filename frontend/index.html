<!DOCTYPE html>
<html lang="en">
<head>
  <script src="js/theme.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HelpDesk Pro — Login</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">
    <button type="button" id="theme-toggle" class="theme-toggle theme-toggle-floating" aria-label="Toggle theme"></button>
    <div class="login-card">
      <div class="brand">
        <span class="brand-mark">HD</span>
        <h1>HelpDesk Pro</h1>
      </div>
      <p class="subtitle">Sign in to manage and track support tickets</p>

      <form id="login-form" novalidate>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required />

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required />

        <p class="form-error" id="form-error" hidden></p>

        <button type="submit" class="btn-primary">Log in</button>
      </form>

      <form id="totp-form" novalidate hidden>
        <p class="subtitle">Enter the 6-digit code from your authenticator app.</p>

        <label for="totp-code">Authentication code</label>
        <input type="text" id="totp-code" name="totp-code" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="123456" required />

        <p class="form-error" id="totp-error" hidden></p>

        <button type="submit" class="btn-primary">Verify</button>
        <p class="signup-hint"><a href="#" id="totp-back-btn">Use a different account</a></p>
      </form>

      <p class="signup-hint" id="login-footer-links">
        <a href="forgot-password.html">Forgot your password?</a>
      </p>
      <p class="signup-hint" id="login-footer-signup">New here? <a href="register.html">Create an account</a></p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
